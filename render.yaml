# Render blueprint. The disk keeps accounts, chat, packs and progress across updates and restarts.
# Without a persistent disk Render erases the filesystem on every deploy, which wipes everything.
services:
  - type: web
    name: project-artemis
    runtime: docker
    plan: starter            # persistent disks need a paid instance. The cloud browser needs ~400 MB per session: use "standard" for more than one
    healthCheckPath: /
    envVars:
      - key: OWNER_PASSWORD
        sync: false           # set this in the Render dashboard, never in git
      - key: OWNER_USERNAME
        value: Warmaster
      - key: ARTEMIS_DATA
        value: /data
      - key: TRUST_PROXY
        value: "1"
    disk:
      name: artemis-data
      mountPath: /data
      sizeGB: 1
